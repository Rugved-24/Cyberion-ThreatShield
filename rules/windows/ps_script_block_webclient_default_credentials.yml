title: CT-009 - PowerShell Web Download Using the Default Network Credentials
id: 9c1a4d20-1b7e-4f3c-8a51-0d6f2e1b4409
status: experimental
description: >
  Detects a script block that builds a .NET WebClient, attaches the process
  default proxy and the default network credential cache, and then calls
  DownloadData. Sending ambient credentials to a web request is the step that
  turns a download into a credential exposure risk.
author: Rigved Londhe
date: 2026-09-29
references:
  - https://attack.mitre.org/versions/v19/techniques/T1105/
  - docs/detection_backlog.md
tags:
  - attack.command-and-control
  - attack.t1105
logsource:
  product: windows
  service: powershell
  category: ps_script_block
detection:
  selection_client:
    EventID: 4104
    Provider: 'Microsoft-Windows-PowerShell'
    ScriptBlockText|contains: 'WebClient'
    ScriptBlockText|contains: 'DefaultNetworkCredentials'
  selection_download:
    ScriptBlockText|contains: 'DownloadData'
  condition: selection_client and selection_download
falsepositives:
  - Enterprise software installers and licence check routines that fetch payloads through
    the corporate proxy using the signed-in user's credentials.
fields:
  - EventID
  - Provider
  - ScriptBlockText
level: high
x-attack:
  framework: MITRE ATT&CK 19.2
  techniques:
    - T1105
x-severity:
  level: high
  rationale: >
    High. The observable is the transfer of a tool rather than the transfer
    itself: nothing in the record identifies what was downloaded, so the rule
    is a lead for scoping and enrichment rather than proof of compromise. The
    severity is set below the two control-bypass rules because this action
    damages nothing by itself, and above the discovery rules because it is the
    point at which an external system becomes involved.
x-scope:
  covered: >
    PowerShell Operational event 4104 whose script block text contains a
    WebClient, the default network credential cache and a DownloadData call.
  excluded: >
    Downloads using Invoke-WebRequest, curl or BITS, downloads that supply
    explicit rather than ambient credentials, and any transfer performed by a
    non-PowerShell process.
x-evidence:
  expected_event_uids:
    - 'DS002:968C4B699F7239D106577B2B8E206EDFAF812F193A60E663966258AF67A56ACC:1827'
  negative_event_uids:
    - 'DS002:968C4B699F7239D106577B2B8E206EDFAF812F193A60E663966258AF67A56ACC:42'
    - 'DS002:968C4B699F7239D106577B2B8E206EDFAF812F193A60E663966258AF67A56ACC:2877'
  note: >
    DS002:1827 is the declared match and contains all three indicators.
    DS002:2877 shows Invoke-Expression being used on a plain string and performs
    no download, so it must not match. The record does not contain the
    transferred content, which is recorded as a limitation rather than inferred.
x-benign-review:
  cases: []
  status: pending
  note: >
    No benign download is present in the recorded telemetry. Because the rule
    keys on the credential cache rather than on the destination, a legitimate
    installer that authenticates to a proxy will match, so the destination or
    the parent process should be used to allow-list known software.
