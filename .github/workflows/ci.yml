name: Validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - name: Install hash-locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.lock.txt
          python -m pip install pip-audit==2.10.1 bandit==1.9.4
      - name: Acquire and verify public telemetry
        run: |
          python scripts/bootstrap_datasets.py
          python scripts/inventory_dataset.py DS001 cmd_mshta_vbscript_execute_psh_2020-10-2202580804.json
          python scripts/inventory_dataset.py DS002 empire_psexec_dcerpc_tcp_svcctl_2020-09-20121608.json
      - name: Build normalized evidence
        run: |
          python scripts/check_capture.py
          python scripts/normalize_dataset.py DS001 DS002
      - name: Validate rules, requirements and security controls
        run: |
          python scripts/test_all.py
          python scripts/prd_compliance.py
          python scripts/security_review.py
          # pySigma requires diskcache 5.6.3; PYSEC-2026-2447 has no fixed release.
          # The residual local-cache risk is documented in SECURITY.md (R1).
          python -m pip_audit --ignore-vuln PYSEC-2026-2447 -r requirements.lock.txt
          python -m pip_audit -r requirements-dashboard.lock.txt
          python -m bandit -q -ll -r scripts dashboard

  dashboard-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dashboard.lock.txt
      - name: Install hash-locked dashboard environment
        run: python -m pip install --require-hashes -r requirements-dashboard.lock.txt
      - name: Render dashboard with Streamlit AppTest
        run: >-
          python -c "from streamlit.testing.v1 import AppTest;
          app=AppTest.from_file('dashboard/app.py').run(timeout=30);
          assert not app.exception, app.exception"
